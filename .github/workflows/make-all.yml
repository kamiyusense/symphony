name: portable-quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    name: Portable Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Set up Hex
        run: mix local.hex --force

      - name: Audit Hex dependencies
        id: hex_audit
        run: mix hex.audit

      - name: Verify portable quality
        id: portable
        run: make --keep-going portable-ci

      - name: Report verification scope
        if: always()
        env:
          HEX_AUDIT_OUTCOME: ${{ steps.hex_audit.outcome }}
          PORTABLE_OUTCOME: ${{ steps.portable.outcome }}
        run: |
          case "$HEX_AUDIT_OUTCOME" in
            success) hex_result=PASS ;;
            failure) hex_result=FAIL ;;
            skipped|"") hex_result=NOT_RUN ;;
            *) hex_result=UNKNOWN ;;
          esac
          case "$PORTABLE_OUTCOME" in
            success) result=PASS ;;
            failure) result=FAIL ;;
            skipped|"") result=NOT_RUN ;;
            *) result=UNKNOWN ;;
          esac
          {
            printf 'Hex Audit: %s\n\n' "$hex_result"
            printf 'Portable Quality: %s\n\n' "$result"
            printf 'OS Isolation: NOT_RUN (separate required Linux gate)\n\n'
            printf 'Full Recovery Gate: NO-GO\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
